name: Build & Release YiTab Extension

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: '是否发布到 GitHub Releases (否则仅生成并上传构建工件 Artifact)'
        type: boolean
        default: true
      is_prerelease:
        description: '是否标记为 Pre-release 预览版本'
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - 'package.json'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Node.js 环境 (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 检查版本号与发布条件
        id: check_plan
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag_name=v${VERSION}" >> $GITHUB_OUTPUT

          TAG_EXISTS=false
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            TAG_EXISTS=true
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "push" ] && [ "$TAG_EXISTS" = "false" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "🚀 检测到 package.json 版本变更 (v${VERSION})，将执行构建与发布"
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "⏩ 版本 v${VERSION} 已存在且非手动触发，跳过本次构建"
          fi

      - name: 安装项目依赖
        if: steps.check_plan.outputs.should_build == 'true'
        run: npm ci

      - name: 执行单元测试
        if: steps.check_plan.outputs.should_build == 'true'
        run: npm test

      - name: 执行 TypeScript 静态类型检查
        if: steps.check_plan.outputs.should_build == 'true'
        run: npm run compile

      - name: 构建并打包 Chrome 扩展 (.zip)
        if: steps.check_plan.outputs.should_build == 'true'
        run: npm run zip

      - name: 上传构建产物至 GitHub Artifacts (随时可免登录下载)
        if: steps.check_plan.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: yitab-v${{ steps.check_plan.outputs.version }}-chrome-mv3
          path: .output/*.zip
          retention-days: 90

      - name: 创建 GitHub Release 并挂载扩展安装包
        if: |
          steps.check_plan.outputs.should_build == 'true' &&
          (github.ref_type == 'tag' ||
           (github.event_name == 'workflow_dispatch' && inputs.create_release) ||
           (github.event_name == 'push'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_plan.outputs.tag_name }}
          name: YiTab 一签 ${{ steps.check_plan.outputs.tag_name }}
          files: .output/*.zip
          generate_release_notes: true
          prerelease: ${{ inputs.is_prerelease || false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
